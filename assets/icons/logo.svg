<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>The Open Book Project</title>
  <!-- The mark of The Open Book Project: an open book with a ribbon, on an indigo seal.
       Flat colours only. tools/icons.py reads this file (circles and paths with M, L, Q, C and Z) and draws
       the PNG icons from it; elements with class="fine" are left out of the smallest icons. -->
  <circle cx="256" cy="256" r="256" fill="#3D4ED8"/>
  <!-- the stack of pages under the open leaves -->
  <path d="M256 194 C214 166 152 160 92 170 L92 344 C152 336 214 342 256 372 C298 342 360 336 420 344 L420 170 C360 160 298 166 256 194 Z" fill="#A9B4FF"/>
  <!-- the two open pages -->
  <path d="M256 176 C214 148 160 140 108 148 L108 324 C160 316 214 324 256 352 Z" fill="#FFFFFF"/>
  <path d="M256 176 C298 148 352 140 404 148 L404 324 C352 316 298 324 256 352 Z" fill="#FFFFFF"/>
  <!-- lines of text -->
  <path class="fine" d="M136 190 C170 184 206 188 232 204" fill="none" stroke="#C9D0FA" stroke-width="8" stroke-linecap="round"/>
  <path class="fine" d="M136 222 C170 216 206 220 232 236" fill="none" stroke="#C9D0FA" stroke-width="8" stroke-linecap="round"/>
  <path class="fine" d="M136 254 C170 248 206 252 232 268" fill="none" stroke="#C9D0FA" stroke-width="8" stroke-linecap="round"/>
  <path class="fine" d="M280 204 C300 190 316 186 318 186" fill="none" stroke="#C9D0FA" stroke-width="8" stroke-linecap="round"/>
  <path class="fine" d="M280 236 C306 220 340 216 376 222" fill="none" stroke="#C9D0FA" stroke-width="8" stroke-linecap="round"/>
  <path class="fine" d="M280 268 C306 252 340 248 376 254" fill="none" stroke="#C9D0FA" stroke-width="8" stroke-linecap="round"/>
  <!-- spine -->
  <path d="M256 180 L256 348" fill="none" stroke="#3D4ED8" stroke-width="5" stroke-linecap="round"/>
  <!-- the ribbon -->
  <path d="M334 128 L366 128 L366 240 L350 222 L334 240 Z" fill="#FF7A59"/>
</svg>
