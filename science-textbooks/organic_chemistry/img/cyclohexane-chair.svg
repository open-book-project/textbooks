<text x="230.0" y="236.9" font-size="14.0" text-anchor="middle" fill="#1a1a1a" font-weight="bold">cyclohexane chair</text>
<text x="450.0" y="94.9" font-size="14.0" text-anchor="start" fill="#c0392b" font-weight="normal">axial: parallel to the ring axis,</text>
<text x="450.0" y="114.9" font-size="14.0" text-anchor="start" fill="#c0392b" font-weight="normal">alternately up and down</text>
<text x="450.0" y="154.9" font-size="14.0" text-anchor="start" fill="#1f5fa8" font-weight="normal">equatorial: pointing outwards, each</text>
<text x="450.0" y="174.9" font-size="14.0" text-anchor="start" fill="#1f5fa8" font-weight="normal">parallel to two ring bonds</text>
