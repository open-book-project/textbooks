<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="The chair conformation of cyclohexane, with the six axial bonds (vertical, red) and six equatorial bonds (roughly in the plane of the ring, blue)">
<rect width="100%" height="100%" fill="#ffffff" rx="6"/>
<g font-family="Helvetica, Arial, sans-serif">
<line x1="86.0" y1="142.0" x2="156.0" y2="86.0" stroke="#1a1a1a" stroke-width="2.20" stroke-linecap="round"/>
<line x1="156.0" y1="86.0" x2="280.0" y2="126.0" stroke="#1a1a1a" stroke-width="2.20" stroke-linecap="round"/>
