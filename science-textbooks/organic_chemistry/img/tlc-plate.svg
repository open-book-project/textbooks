<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 330" width="790" height="330" role="img" aria-label="A developed thin-layer chromatography plate: the retention factor of each spot is the distance it moved divided by the distance moved by the solvent front">
<rect width="100%" height="100%" fill="#ffffff" rx="6"/>
<g font-family="Helvetica, Arial, sans-serif">
<rect x="120" y="30" width="200" height="270" rx="4" fill="#f4f1e6" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="128.0" y1="260.0" x2="312.0" y2="260.0" stroke="#6b6b6b" stroke-width="1.20" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="128.0" y1="60.0" x2="312.0" y2="60.0" stroke="#1f5fa8" stroke-width="1.20" stroke-linecap="round" stroke-dasharray="5 4"/>
<ellipse cx="165.0" cy="136.0" rx="10" ry="7" fill="#7b4fa0" fill-opacity="0.7"/>
<ellipse cx="220.0" cy="210.0" rx="10" ry="7" fill="#7b4fa0" fill-opacity="0.7"/>
<ellipse cx="275.0" cy="136.0" rx="10" ry="7" fill="#7b4fa0" fill-opacity="0.7"/>
<ellipse cx="275.0" cy="210.0" rx="10" ry="7" fill="#7b4fa0" fill-opacity="0.7"/>
<line x1="470.0" y1="260.0" x2="470.0" y2="60.0" stroke="#1a1a1a" stroke-width="1.20" stroke-linecap="round"/>
<line x1="464.0" y1="260.0" x2="476.0" y2="260.0" stroke="#1a1a1a" stroke-width="1.20" stroke-linecap="round"/>
<line x1="464.0" y1="60.0" x2="476.0" y2="60.0" stroke="#1a1a1a" stroke-width="1.20" stroke-linecap="round"/>
<line x1="500.0" y1="260.0" x2="500.0" y2="136.0" stroke="#c0392b" stroke-width="1.20" stroke-linecap="round"/>
<line x1="494.0" y1="136.0" x2="506.0" y2="136.0" stroke="#c0392b" stroke-width="1.20" stroke-linecap="round"/>
<text x="330.0" y="278.2" font-size="12.0" text-anchor="start" fill="#6b6b6b" font-weight="normal">baseline (start)</text>
<text x="330.0" y="64.2" font-size="12.0" text-anchor="start" fill="#1f5fa8" font-weight="normal">solvent front</text>
<circle cx="165.0" cy="260.0" r="2.5" fill="#6b6b6b"/>
<text x="165.0" y="282.2" font-size="12.0" text-anchor="middle" fill="#1a1a1a" font-weight="normal">A</text>
<circle cx="220.0" cy="260.0" r="2.5" fill="#6b6b6b"/>
<text x="220.0" y="282.2" font-size="12.0" text-anchor="middle" fill="#1a1a1a" font-weight="normal">B</text>
<circle cx="275.0" cy="260.0" r="2.5" fill="#6b6b6b"/>
<text x="275.0" y="282.2" font-size="12.0" text-anchor="middle" fill="#1a1a1a" font-weight="normal">mix</text>
<text x="462.0" y="134.2" font-size="12.0" text-anchor="end" fill="#1a1a1a" font-weight="normal">solvent:</text>
<text x="462.0" y="150.2" font-size="12.0" text-anchor="end" fill="#1a1a1a" font-weight="normal">20.0 mm</text>
<text x="508.0" y="232.2" font-size="12.0" text-anchor="start" fill="#c0392b" font-weight="normal">A: 12.4 mm</text>
<text x="580.0" y="64.5" font-size="13.0" text-anchor="start" fill="#1a1a1a" font-weight="normal">Rf = distance moved by spot</text>
<text x="580.0" y="84.5" font-size="13.0" text-anchor="start" fill="#1a1a1a" font-weight="normal">  ÷ distance moved by solvent</text>
<text x="580.0" y="119.5" font-size="13.0" text-anchor="start" fill="#1a1a1a" font-weight="bold">Rf(A) = 12.4 / 20.0 = 0.62</text>
<text x="580.0" y="144.6" font-size="13.0" text-anchor="start" fill="#1a1a1a" font-weight="bold">Rf(B) = 5.0 / 20.0 = 0.25</text>
</g>
</svg>
