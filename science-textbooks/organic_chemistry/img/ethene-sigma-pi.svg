<text x="470.0" y="54.9" font-size="14.0" text-anchor="start" fill="#1f5fa8" font-weight="normal">of p orbitals, above and below</text>
<text x="470.0" y="74.9" font-size="14.0" text-anchor="start" fill="#1f5fa8" font-weight="normal">the plane of the molecule</text>
<text x="40.0" y="276.9" font-size="14.0" text-anchor="start" fill="#1a1a1a" font-weight="normal">σ framework: sp<tspan dy="-5.9" font-size="10.1">2</tspan><tspan dy="5.9">​</tspan>–sp<tspan dy="-5.9" font-size="10.1">2</tspan><tspan dy="5.9">​</tspan> and sp<tspan dy="-5.9" font-size="10.1">2</tspan><tspan dy="5.9">​</tspan>–1s overlaps, all in one plane</text>
