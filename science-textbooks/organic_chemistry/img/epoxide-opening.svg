<text x="215.0" y="126.0" font-size="17.0" text-anchor="middle" fill="#1a1a1a" font-weight="normal">CH<tspan dy="5.1" font-size="12.2">3</tspan><tspan dy="-5.1">​</tspan>O</text>
<circle cx="228.0" cy="97.5" r="6.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.1"/>
