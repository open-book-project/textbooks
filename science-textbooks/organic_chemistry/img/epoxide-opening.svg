<text x="132.0" y="242.9" font-size="14.0" text-anchor="middle" fill="#1a1a1a" font-weight="normal">H</text>
<circle cx="146.1" cy="268.9" r="6.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.1"/>
