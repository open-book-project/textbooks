<text x="45.0" y="340.9" font-size="14.0" text-anchor="middle" fill="#1a1a1a" font-weight="normal">CH<tspan dy="4.2" font-size="10.1">3</tspan><tspan dy="-4.2">​</tspan>OH</text>
<text x="290.0" y="312.6" font-size="13.0" text-anchor="middle" fill="#1a1a1a" font-weight="normal">− H⁺</text>
<rect x="358.0" y="235.5" width="43.2" height="20.4" fill="#ffffff"/>
<text x="379.6" y="251.9" font-size="17.0" text-anchor="middle" fill="#1a1a1a" font-weight="normal">OCH<tspan dy="5.1" font-size="12.2">3</tspan><tspan dy="-5.1">​</tspan></text>
<rect x="440.9" y="279.5" width="25.1" height="20.4" fill="#ffffff"/>
<text x="442.9" y="295.9" font-size="17.0" text-anchor="start" fill="#1a1a1a" font-weight="normal">OH</text>
<text x="400.0" y="339.2" font-size="12.0" text-anchor="middle" fill="#6b6b6b" font-weight="normal">2-methoxypropan-1-ol</text>
<text x="530.0" y="294.6" font-size="13.0" text-anchor="start" fill="#1a1a1a" font-weight="normal">attack at the more substituted C,</text>
<text x="530.0" y="312.6" font-size="13.0" text-anchor="start" fill="#1a1a1a" font-weight="normal">which carries more positive charge</text>
