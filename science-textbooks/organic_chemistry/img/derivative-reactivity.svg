<text x="26" y="185" font-size="13" fill="#1f5fa8" text-anchor="middle" transform="rotate(-90 26 185)">more reactive</text>
<text x="400.0" y="344.6" font-size="13.0" text-anchor="middle" fill="#6b6b6b" font-weight="normal">A derivative can be converted into any derivative below it, but not easily into one above it.</text>
